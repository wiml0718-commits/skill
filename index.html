<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="技能樹"/>
<meta name="theme-color" content="#050b12"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>人生技能樹</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#050b12;--bg2:#0a1520;--bg3:#0f1f30;
  --border:#1e3a4a;--border2:#2a4a6a;
  --text:#e8dcc8;--text2:#8aaccа;--muted:#3a5a7a;--muted2:#2a4a6a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;}
#app{height:100%;display:flex;flex-direction:column;}

/* ── Nav Bar ── */
#navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + var(--safe-top)) 16px 10px;
  background:linear-gradient(180deg,#0a1a2a,var(--bg));
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.nav-title{font-family:'Cinzel',serif;font-size:15px;letter-spacing:2px;color:var(--text);}
.nav-sub{font-size:9px;letter-spacing:3px;color:#4a9eff;margin-top:2px;}
.nav-stat{text-align:right;}
.nav-stat-val{font-family:'Cinzel',serif;font-size:16px;color:#f59e0b;}
.nav-stat-lbl{font-size:8px;color:var(--muted);margin-top:1px;}

/* ── Tab Bar ── */
#tabbar{
  display:flex;border-top:1px solid var(--border);
  padding-bottom:var(--safe-bot);background:var(--bg2);flex-shrink:0;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px;cursor:pointer;transition:all .2s;border:none;background:none;color:var(--muted);font-size:8px;letter-spacing:1px;gap:3px;}
.tab.active{color:#4a9eff;}
.tab-icon{font-size:18px;}

/* ── Main Content ── */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(10px + var(--safe-bot));}

/* ── Core Card (list) ── */
.core-card{
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:10px;cursor:pointer;transition:all .25s;
  position:relative;overflow:hidden;
}
.core-card:active{transform:scale(.98);}
.core-card.selected{border-color:var(--card-color);}
.core-card-bg{position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,var(--card-color-faint),transparent);}
.core-row{display:flex;align-items:center;gap:12px;}
.core-icon{font-size:28px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-radius:10px;border:1px solid var(--border);flex-shrink:0;}
.core-info{flex:1;min-width:0;}
.core-name{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:var(--text);}
.core-title{font-size:10px;letter-spacing:2px;margin-top:1px;}
.core-right{text-align:right;flex-shrink:0;}
.core-lv{font-family:'Cinzel',serif;font-size:22px;font-weight:900;}
.core-lv-lbl{font-size:8px;color:var(--muted);margin-top:1px;}
.xp-bar-wrap{margin-top:8px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;border:1px solid var(--border);}
.xp-bar{height:100%;border-radius:2px;transition:width .6s ease;}
.xp-label{display:flex;justify-content:space-between;margin-top:3px;}
.xp-label span{font-size:8px;color:var(--muted2);}

/* ── Detail Page ── */
.detail-header{
  border-radius:14px;padding:18px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.detail-header-bg{position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,var(--card-color-faint),transparent);pointer-events:none;}
.detail-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.detail-icon{font-size:40px;}
.detail-name{font-family:'Cinzel',serif;font-size:20px;font-weight:700;}
.detail-title{font-size:11px;letter-spacing:2px;margin-top:3px;}
.detail-desc{font-size:11px;color:var(--muted);margin-top:4px;}
.lv-ring-wrap{flex-shrink:0;text-align:center;}
.lv-ring-lbl{font-size:8px;margin-top:3px;}

/* big xp block */
.xp-block{background:var(--bg);border-radius:10px;padding:12px 14px;border:1px solid var(--border);margin-bottom:12px;}
.xp-block-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:10px;color:var(--muted);}
.xp-big-bar{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
.xp-big-fill{height:100%;border-radius:5px;transition:width .8s ease;}
.lv-dots{display:flex;gap:5px;margin-top:8px;justify-content:center;}
.lv-dot{width:8px;height:8px;border-radius:50%;transition:all .3s;}

/* ── Sub skill card ── */
.sub-card{
  background:var(--bg);border-radius:10px;padding:12px;
  border:1px solid var(--border);cursor:pointer;transition:all .2s;margin-bottom:8px;
}
.sub-card:active{transform:scale(.98);}
.sub-row{display:flex;align-items:flex-start;gap:10px;}
.sub-icon{font-size:22px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border-radius:8px;border:1px solid var(--border);flex-shrink:0;}
.sub-name{font-size:14px;font-weight:700;color:var(--text);}
.sub-desc{font-size:10px;color:var(--muted);margin-top:2px;}
.sub-source{font-size:9px;color:var(--muted2);margin-top:2px;}
.type-badge{font-size:9px;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.sub-xp-bar{height:3px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:7px;}
.sub-xp-fill{height:100%;border-radius:2px;transition:width .5s;}
.sub-xp-row{display:flex;justify-content:space-between;margin-top:3px;font-size:8px;}

/* ── Section header ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-hd-title{font-size:10px;letter-spacing:2px;color:var(--muted);}
.btn-add{border:none;border-radius:16px;padding:5px 14px;cursor:pointer;font-size:10px;letter-spacing:1px;font-family:'Cinzel',serif;}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.9);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:300;backdrop-filter:blur(6px);
}
.modal-sheet{
  background:linear-gradient(160deg,#0d1f2d,var(--bg));
  border-radius:20px 20px 0 0;border-top:1px solid var(--border2);
  width:100%;max-height:92vh;overflow-y:auto;
  padding:8px 18px calc(20px + var(--safe-bot));
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 16px;}
.modal-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;margin-bottom:16px;}
.form-label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px;}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;
  padding:10px 12px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;
  outline:none;margin-bottom:12px;}
.form-input:focus{border-color:#4a9eff88;}
.form-select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;
  padding:10px 12px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:13px;
  outline:none;margin-bottom:12px;-webkit-appearance:none;}
.type-toggle{display:flex;gap:8px;margin-bottom:12px;}
.type-btn{flex:1;padding:9px;border-radius:8px;cursor:pointer;font-size:11px;border:1px solid var(--border);
  background:var(--bg);color:var(--muted);transition:all .2s;}
.xp-input-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.xp-num{width:80px;background:var(--bg);border-radius:8px;padding:10px;
  color:#f59e0b;font-family:'Cinzel',serif;font-size:18px;font-weight:700;
  border:1px solid #f59e0b66;outline:none;text-align:center;}
.xp-quick{flex:1;display:flex;flex-wrap:wrap;gap:5px;}
.xp-qbtn{border:1px solid var(--border);background:var(--bg);color:var(--muted);
  border-radius:6px;padding:4px 9px;cursor:pointer;font-size:10px;}
.notes-list{margin-bottom:8px;}
.note-item{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px;}
.note-text{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:6px 9px;font-size:10px;color:#b0c8d8;line-height:1.5;white-space:pre-wrap;}
.note-text.collapsed{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.note-toggle{font-size:9px;color:#a855f7;cursor:pointer;margin-top:3px;display:inline-block;
  font-family:'Share Tech Mono',monospace;}
.note-date{font-size:8px;color:var(--muted2);display:block;margin-top:2px;}
.note-del{background:none;border:none;color:#ef444466;cursor:pointer;font-size:14px;padding:4px;flex-shrink:0;}
.note-add-row{display:flex;gap:6px;}
.note-add-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;color:var(--text);font-size:11px;outline:none;font-family:'Share Tech Mono',monospace;}
.note-add-btn{background:none;border:1px solid var(--border2);color:var(--text);
  border-radius:7px;padding:8px 13px;cursor:pointer;font-size:16px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.btn-save{flex:1;border:none;border-radius:8px;padding:12px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;transition:opacity .2s;}
.btn-del{background:#1a0808;border:1px solid #ef444455;color:#ef4444;
  border-radius:8px;padding:12px 16px;cursor:pointer;font-size:12px;}

/* ── Back button ── */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;
  color:var(--muted);cursor:pointer;font-size:12px;margin-bottom:12px;padding:4px 0;}
.back-btn:active{color:var(--text);}

/* ── Empty state ── */
.empty-state{text-align:center;color:var(--muted2);padding:30px 0;font-size:11px;
  border:1px dashed var(--border);border-radius:10px;line-height:2;}

/* ── Stats page ── */
.stat-block{background:var(--bg3);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:10px;}
.stat-block-title{font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-lbl{font-size:11px;color:var(--text);}
.stat-val{font-family:'Cinzel',serif;font-size:13px;}
.rank-bar-wrap{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:4px;}

/* ── toast ── */
#toast{position:fixed;bottom:calc(80px + var(--safe-bot));left:50%;transform:translateX(-50%);
  background:#22d3ee22;border:1px solid #22d3ee66;color:#22d3ee;
  padding:7px 18px;border-radius:20px;font-size:11px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;}

/* scrollbar */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── Quest styles ── */
.quest-tabs{display:flex;gap:6px;margin-bottom:14px;}
.qtab{flex:1;padding:7px 4px;border-radius:20px;cursor:pointer;font-size:10px;
  letter-spacing:1px;border:1px solid var(--border);background:transparent;
  color:var(--muted);transition:all .2s;text-align:center;}
.qtab.active{color:#fff;}
.quest-card{border-radius:12px;padding:13px 14px;margin-bottom:9px;
  border:1px solid var(--border);background:var(--bg3);
  position:relative;overflow:hidden;transition:all .2s;}
.quest-card:active{transform:scale(.98);}
.quest-card.done{opacity:.5;}
.quest-card.overdue{border-color:#ef444455;}
.quest-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;
  padding:2px 7px;border-radius:4px;font-weight:700;letter-spacing:1px;margin-bottom:7px;}
.quest-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;
  display:flex;align-items:center;gap:7px;}
.quest-desc{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.5;}
.quest-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.quest-reward{font-size:10px;color:#f59e0b;}
.quest-due{font-size:9px;}
.quest-due.overdue{color:#ef4444;}
.quest-due.soon{color:#f97316;}
.quest-due.ok{color:var(--muted2);}
.quest-complete-btn{border:none;border-radius:8px;padding:5px 11px;cursor:pointer;
  font-size:11px;font-family:'Cinzel',serif;letter-spacing:1px;flex-shrink:0;}
/* ── Goal / Step styles ── */
.goal-add{width:100%;background:#4a9eff11;border:1px dashed var(--border2);color:#4a9eff;
  border-radius:12px;padding:11px;cursor:pointer;font-size:11px;margin-bottom:10px;
  font-family:inherit;letter-spacing:1px;}
.goal-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;}
.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.goal-title{font-size:14px;font-weight:700;color:var(--text);}
.goal-why{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5;}
.goal-count{font-size:10px;color:var(--muted2);white-space:nowrap;}
.goal-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.step-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:9px;}
.step-main{display:flex;align-items:center;gap:10px;}
.step-main.next{background:#4a9eff0f;border-radius:9px;padding:9px;margin:-2px 0 2px;}
.step-text{flex:1;min-width:0;}
.step-title{font-size:13px;color:var(--text);word-break:break-word;}
.step-goal{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:1px;}
.step-row{display:flex;align-items:center;gap:9px;padding:7px 2px;
  border-bottom:1px solid var(--border);font-size:12px;color:var(--text);}
.step-row:last-of-type{border-bottom:none;}
.step-row.is-done{opacity:.45;text-decoration:line-through;}
.step-row.muted{color:var(--muted2);font-size:11px;justify-content:center;}
.step-row-title{flex:1;min-width:0;word-break:break-word;}
.kind-tag{font-size:10px;opacity:.85}
.bujo-glyph{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;flex-shrink:0;border-radius:6px;background:var(--bg);
  border:1px solid var(--border2);color:#4a9eff;font-size:12px;line-height:1;}
.step-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;}
.step-btn{border:1px solid var(--border2);background:transparent;color:var(--text2);
  border-radius:8px;padding:5px 11px;cursor:pointer;font-size:10px;font-family:inherit;}
.step-btn.done{border-color:#22d3ee;color:#22d3ee;background:#22d3ee18;}
.step-select{border:1px solid var(--border2);background:var(--bg2);color:var(--text2);
  border-radius:8px;padding:5px 8px;font-size:10px;font-family:inherit;max-width:150px;}
.step-hint{font-size:10px;color:var(--muted2);}
.defer-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:10px;
  font-size:9px;background:#f9731622;border:1px solid #f9731666;color:#f97316;
  vertical-align:middle;letter-spacing:.5px;}
.step-btn.drop{border-color:#5a7a9a;color:var(--muted);}
.review-section{margin-bottom:18px;}
.review-head{font-family:'Cinzel',serif;font-size:12px;color:var(--text);
  letter-spacing:1px;margin-bottom:4px;}
.review-hint{font-size:10px;color:var(--muted2);line-height:1.6;margin-bottom:10px;}
.inbox-capture{display:flex;gap:6px;margin-bottom:12px;}
.inbox-capture input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--border2);
  color:var(--text);border-radius:10px;padding:10px 12px;font-size:12px;font-family:inherit;}
.inbox-capture input:focus{outline:none;border-color:#4a9eff;}
.quest-add-fab{position:fixed;bottom:calc(72px + var(--safe-bot) + 14px);right:16px;
  width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#4a9eff,#a855f7);
  color:#fff;font-size:24px;cursor:pointer;z-index:50;
  box-shadow:0 4px 20px #4a9eff44;display:flex;align-items:center;justify-content:center;}
.done-strike{text-decoration:line-through;opacity:.6;}

.reward-skill-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.reward-skill-row{display:flex;align-items:center;gap:8px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.reward-skill-name{flex:1;font-size:11px;color:var(--text);}
.reward-xp-input{width:64px;background:var(--bg2);border:1px solid #f59e0b66;
  border-radius:6px;padding:4px 6px;color:#f59e0b;font-family:"Cinzel",serif;
  font-size:13px;font-weight:700;outline:none;text-align:center;}
.reward-del{background:none;border:none;color:#ef444466;cursor:pointer;font-size:14px;padding:2px 4px;}
.skill-search{width:100%;background:var(--bg);border:1px solid var(--border2);
  border-radius:7px;padding:8px 10px;color:var(--text);font-size:12px;
  outline:none;margin-bottom:6px;font-family:"Share Tech Mono",monospace;}
.skill-pick-list{max-height:160px;overflow-y:auto;border:1px solid var(--border);
  border-radius:8px;background:var(--bg);}
.skill-pick-item{padding:9px 12px;font-size:11px;cursor:pointer;
  border-bottom:1px solid var(--border);color:var(--text);transition:background .15s;}
.skill-pick-item:last-child{border-bottom:none;}
.skill-pick-item:active{background:var(--bg3);}
.daily-done-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;
  color:#10b981;background:#10b98118;border:1px solid #10b98144;
  padding:2px 8px;border-radius:4px;margin-left:6px;}
</style>
</head>
<body>
<div id="app">
  <div id="navbar">
    <div>
      <div class="nav-title" id="char-name-display">冒險者</div>
      <div class="nav-sub">▸ 人生技能樹</div>
    </div>
    <div class="nav-stat" id="nav-stats"></div>
  </div>
  <div id="content"></div>
  <div id="tabbar">
    <button class="tab active" data-tab="skills" onclick="switchTab('skills')">
      <span class="tab-icon">⚔️</span>技能樹
    </button>
    <button class="tab" data-tab="stats" onclick="switchTab('stats')">
      <span class="tab-icon">📊</span>統計
    </button>
    <button class="tab" data-tab="quests" onclick="switchTab('quests')">
      <span class="tab-icon">📜</span>任務
    </button>
    <button class="tab" data-tab="goals" onclick="switchTab('goals')">
      <span class="tab-icon">🎯</span>目標
    </button>
    <button class="tab" data-tab="profile" onclick="switchTab('profile')">
      <span class="tab-icon">🧙</span>檔案
    </button>
  </div>
</div>
<div id="toast">✓ 已儲存</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const SUB_MAX_LV = 9;
const CORES = [
  {id:"body",    name:"身體管理", title:"John Wick",       icon:"🔫", color:"#ef4444"},
  {id:"emotion", name:"情緒管理", title:"明鏡止水",         icon:"🪞", color:"#22d3ee"},
  {id:"time",    name:"時間管理", title:"預知眼",           icon:"👁️", color:"#a855f7"},
  {id:"think",   name:"思維能力", title:"零的領域",         icon:"🌀", color:"#6366f1"},
  {id:"learn",   name:"學習能力", title:"識破",             icon:"📖", color:"#f59e0b"},

let state = {charName:"冒險者", subSkills:[], cores:[...CORES]};

// 資料一律經由 src/store.js 存取，這裡不再直接碰 localStorage。store 內部是
// schema v2，legacyState() / saveLegacyState() 負責投影成這個檢視認得的形狀。
function loadState(){
  state=window.Goals.legacyState();
}
let saveTimer=null;
function writeState(){
  // Always persist current CORES state
  if(!state.cores)state.cores=[...CORES];
  try{window.Goals.saveLegacyState(state);}catch{}
}
function saveState(silent=false){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    saveTimer=null;
    writeState();
    if(!silent)showToast("✓ 已儲存");
  },600);
}
// 把還在等 debounce 的編輯立刻寫進 store。匯出時一定要先做，否則剛改完名字
// 就按匯出，備份裡會少掉那筆已經回報「已儲存」的變更。
function flushState(){
  if(saveTimer===null)return;
  clearTimeout(saveTimer);saveTimer=null;
  writeState();
}
function showToast(msg,duration=1800){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),duration);
}

// ── Level helpers ─────────────────────────────────────────────────────────────
// 等級曲線、階層名與進度都住在 src/model.js 與 src/rpg.js，這裡只轉呼叫，
// 不再各自留一份公式（§4.1）。
// 核心 XP = 底下所有技能的總和，包含承接技能「歷練」（§4.3）。歷練不投影進
// legacy 快照（它是系統產生的容器，不該出現在技能清單裡），但它的 XP 是真的，
// 少算會讓等級、雷達圖與完成回饋跟 store 對不上，所以直接向 store 要。
function generalXP(coreId){
  const sk=window.Goals.listSkills().find(x=>x.id===`sk_${coreId}_general`);
  return sk?sk.xp||0:0;
}
function getCoreXP(coreId){
  return state.subSkills.filter(s=>s.coreId===coreId).reduce((a,s)=>a+(s.xp||0),0)
    +generalXP(coreId);
}
function levelXp(i){return window.Goals.LEVEL_XP[i];}
function maxLv(){return window.Goals.MAX_LV;}
function calcLv(xp){return window.Goals.calcLv(xp);}
function lvName(lv){return window.Goals.lvName(lv);}
function lvProgress(xp){return window.Goals.levelProgress(xp);}

function svgRing(xp,color,size=56){
  const col=cssColor(color);
  const r=(size-8)/2,circ=2*Math.PI*r;
  const {lv,pct}=lvProgress(xp);
  const dash=circ*(lv>=maxLv()?1:pct/100);
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1e3a4a" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"
      style="filter:drop-shadow(0 0 4px ${col})"/>
    <text x="${size/2}" y="${size/2+1}" text-anchor="middle" dominant-baseline="middle"
      fill="${col}" font-size="14" font-weight="700" font-family="monospace">${lv}</text>
  </svg>`;
}

function switchTab(tab){
  currentTab=tab;detailCore=null;
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.tab===tab);
  });
  render();
}

function render(){
  updateNav();
  const el=document.getElementById("content");
  try{
    if(currentTab==="skills"){
      if(detailCore)el.innerHTML=renderDetail(detailCore);
      else el.innerHTML=renderCoreList();
    }else if(currentTab==="stats"){
      el.innerHTML=statsSubTabs()+(statsSub==="ach"?renderAchievements()
        :statsSub==="review"?renderReview():renderStats());
    }else if(currentTab==="quests"){
      el.innerHTML=renderQuests();
    }else if(currentTab==="goals"){
      el.innerHTML=window.Goals?window.Goals.render():`<div class="empty-state">載入中…</div>`;
    }else{
      el.innerHTML=renderProfile();

      <button onclick="currentTab='skills';detailCore=null;render()" style="margin-top:16px;

        padding:10px 20px;cursor:pointer;font-size:12px">← 返回首頁</button>
    </div>`;
  }
  // 提醒與 badge 依當前資料重算。refresh 內部自行吞錯，不會影響渲染。
  // 任務已經統一成 steps，再把 quests 傳進去會讓同一件事被算兩次
  if(window.Reminders)window.Reminders.refresh();
  flushUnlocks();
}

// ── Detail ────────────────────────────────────────────────────────────────────
function openDetail(coreId){detailCore=coreId;render();}

function renderDetail(coreId){
  const c=CORE_MAP[coreId];
  const col=cssColor(c.color);
  const xp=getCoreXP(coreId);
  const {lv,pct,cur,need}=lvProgress(xp);

    `<div class="lv-dot" style="width:${i<=lv?9:7}px;height:${i<=lv?9:7}px;background:${i<=lv?col:"#1e3a4a"};${i<=lv?`box-shadow:0 0 5px ${col}`:""}" title="Lv${i}"></div>`
  ).join("");

  // 承接技能「歷練」：沒有指定技能的行動累積在這裡（§4.3）。它是系統產生的
  // 容器，不能編輯也不單獨刪除，所以只讀地列出來——否則核心總 EXP 會比下面
  // 這串加起來多，看的人只會覺得數字有問題。
  const generalXp=generalXP(coreId);
  const generalCard=generalXp>0
    ?`<div class="sub-card" style="opacity:.85">
        <div class="sub-row">
          <div class="sub-icon">✨</div>
          <div style="flex:1;min-width:0">
            <span class="sub-name">歷練</span>
            <div class="sub-desc">沒有指定技能的行動累積在這裡</div>
            <div class="sub-xp-row"><span style="color:var(--muted2)">EXP ${generalXp}</span></div>
          </div>
        </div>
      </div>`
    :"";

  const subCards=subs.length===0
    ?`<div class="empty-state">尚未加入子技能<br><small>每個子技能的 EXP 都會累計到此核心技能</small></div>`
    :subs.map(s=>{
      const tc=s.type==="active"?"#f59e0b":"#22d3ee";
      const ti=s.type==="active"?"⚡":"🛡️";
      const tl=s.type==="active"?"主動":"被動";
      const subLv=Math.min(calcLv(s.xp),SUB_MAX_LV);
      const pct2=subLv<SUB_MAX_LV?lvProgress(s.xp).pct:100;
      const quickBtn=s.type==="active"
        ?`<button onclick="event.stopPropagation();quickAddXP('${s.id}')"
            style="flex-shrink:0;background:${tc}22;border:1px solid ${tc}66;color:${tc};
            border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:700;
            font-family:'Cinzel',serif;line-height:1">+10</button>`
        :"";
      return `<div class="sub-card" onclick="editSub('${s.id}')">
        <div class="sub-row">
          <div class="sub-icon">${esc(s.icon)}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
              <span class="sub-name">${esc(s.name)} <span style="color:${col};font-size:11px;font-family:'Cinzel',serif">Lv${subLv}</span></span>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                ${quickBtn}
                <span class="type-badge" style="color:${tc};background:${tc}18;border:1px solid ${tc}44">${ti} ${tl}</span>
              </div>
            </div>
            <div class="sub-desc">${esc(s.desc||"")}</div>
            ${s.source?`<div class="sub-source" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📚 ${esc(s.source)}</div>`:""}
            <div class="sub-xp-bar"><div class="sub-xp-fill" style="width:${pct2}%;background:linear-gradient(90deg,${col}66,${col});box-shadow:0 0 5px ${col}"></div></div>
            <div class="sub-xp-row"><span style="color:var(--muted2)">EXP ${s.xp} / Lv${subLv<SUB_MAX_LV?subLv+1:"MAX"} 需 ${subLv<SUB_MAX_LV?levelXp(subLv+1):levelXp(SUB_MAX_LV)}</span><span style="color:${col}">${subLv<SUB_MAX_LV?`→ 還差 ${levelXp(subLv+1)-s.xp}`:"Lv9 MAX ★"}</span></div>
          </div>
        </div>
        ${s.notes&&s.notes.length?`<div style="color:var(--muted2);font-size:9px;margin-top:6px">📝 ${s.notes.length} 條筆記</div>`:""}
      </div>`;
    }).join("");

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button class="back-btn" style="margin-bottom:0" onclick="detailCore=null;render()">← 返回</button>
      <button onclick="deleteCore('${coreId}')"
        style="background:#1a0808;border:1px solid #ef444455;color:#ef4444;
        border-radius:8px;padding:6px 12px;cursor:pointer;font-size:11px">
        🗑 刪除核心技能
      </button>
    </div>
    <div class="detail-header" style="--card-color:${col};--card-color-faint:${col}09">
      <div class="detail-header-bg"></div>
      <div class="detail-top">
        <div>
          <div class="detail-icon">${esc(c.icon)}</div>
        </div>
        <div style="flex:1">
          <div class="detail-name">${esc(c.title)}</div>
          <div class="detail-title" style="color:${col};opacity:0.6">${esc(c.name)}</div>
          <div class="detail-desc">${esc(c.desc||"")}</div>
        </div>
        <div class="lv-ring-wrap">
          ${svgRing(xp,c.color,64)}
          <div class="lv-ring-lbl" style="color:${col}">${lvName(lv)}</div>
        </div>
      </div>
      <div class="xp-block">
        <div class="xp-block-top">
          <span>總 EXP：<span style="color:${col};font-family:'Cinzel',serif">${xp}</span></span>
          <span>${lv<maxLv()?`距 Lv${lv+1} 還需 ${need-cur} EXP`:"Lv99 已達神域！"}</span>
        </div>
        <div class="xp-big-bar">
          <div class="xp-big-fill" style="width:${pct}%;background:linear-gradient(90deg,${col}66,${col});box-shadow:0 0 10px ${col}"></div>
        </div>
        <div class="lv-dots">${dots}</div>
      </div>
    </div>
    <div class="section-hd">
      <span class="section-hd-title">子技能 (${subs.length})</span>
      <div style="display:flex;gap:6px">
        ${subs.length>=2?`<button class="btn-add" style="color:#a855f7;background:#a855f718;border:1px solid #a855f755"
          onclick="openMergeSub('${coreId}')">⚗ 合併</button>`:""}

          onclick="openAddSub('${coreId}')">+ 新增</button>
      </div>
    </div>
    ${generalCard}${subCards}
    <div style="height:10px"></div>
  `;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats(){
  const sorted=[...CORES].map(c=>({...c,xp:getCoreXP(c.id),lv:calcLv(getCoreXP(c.id))}))
    .sort((a,b)=>b.xp-a.xp);
  // 總 EXP 走 store 的完整技能清單：與 getCoreXP() 一致，含承接技能「歷練」，
  // 否則核心加起來會比這裡的總數大（§4.3）。
  const totalXP=window.Goals.listSkills().reduce((a,s)=>a+(s.xp||0),0);
  const totalLv=CORES.reduce((a,c)=>a+calcLv(getCoreXP(c.id)),0);
  const activeCnt=state.subSkills.filter(s=>s.type==="active").length;
  const passiveCnt=state.subSkills.filter(s=>s.type==="passive").length;
  const notesCnt=state.subSkills.reduce((a,s)=>a+(s.notes?s.notes.length:0),0);
  const maxXP=sorted[0]?.xp||1;

  const overview=`<div class="stat-block">
    <div class="stat-block-title">◆ 總覽</div>
    <div class="stat-row"><span class="stat-lbl">總等級</span><span class="stat-val" style="color:#f59e0b">★ ${totalLv}</span></div>
    <div class="stat-row"><span class="stat-lbl">總 EXP</span><span class="stat-val" style="color:#22d3ee">${totalXP}</span></div>
    <div class="stat-row"><span class="stat-lbl">子技能數量</span><span class="stat-val" style="color:#a855f7">${state.subSkills.length}</span></div>
    <div class="stat-row"><span class="stat-lbl">⚡ 主動技能</span><span class="stat-val" style="color:#f59e0b">${activeCnt}</span></div>
    <div class="stat-row"><span class="stat-lbl">🛡️ 被動技能</span><span class="stat-val" style="color:#22d3ee">${passiveCnt}</span></div>
    <div class="stat-row"><span class="stat-lbl">📝 知識筆記</span><span class="stat-val" style="color:#ec4899">${notesCnt}</span></div>
  </div>`;

  const ranking=`<div class="stat-block">
    <div class="stat-block-title">◆ 核心技能排行</div>
    ${sorted.map((c,i)=>`
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:11px">${esc(c.icon)} ${esc(c.name)}</span>
          <span style="color:${cssColor(c.color)};font-family:'Cinzel',serif;font-size:12px">Lv${c.lv} · ${c.xp} EXP</span>
        </div>
        <div class="rank-bar-wrap">
          <div style="height:4px;width:${Math.round(c.xp/maxXP*100)}%;background:linear-gradient(90deg,${cssColor(c.color)}66,${cssColor(c.color)});border-radius:2px;box-shadow:0 0 6px ${cssColor(c.color)}"></div>
        </div>
      </div>`).join("")}
  </div>`;

  return charCard()+radarBlock()+overview+ranking;
}

// ── 屬性雷達圖（§6.1）────────────────────────────────────────────────────────
// N = 目前核心數，inline SVG，不引入圖表函式庫。N < 3 構不成多邊形，退回長條。
function radarBlock(){
  const levels=window.Goals.coreLevels();
  const body=levels.length<3?levelBars(levels):radarSvg(levels);
  return `<div class="stat-block">
    <div class="stat-block-title">◆ 屬性</div>
    ${body}
  </div>`;
}

function levelBars(levels){
  if(levels.length===0)return `<div class="empty-state">還沒有核心技能</div>`;
  const max=Math.max(1,...levels.map(l=>l.lv));
  return levels.map(l=>{
    const col=cssColor(l.core.color);
    return `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span>${esc(l.core.icon)} ${esc(l.core.name)}</span>
        <span style="color:${col};font-family:'Cinzel',serif">Lv${l.lv}</span>
      </div>
      <div class="rank-bar-wrap">
        <div style="height:4px;width:${Math.round(l.lv/max*100)}%;background:${col};
          border-radius:2px;box-shadow:0 0 6px ${col}"></div>
      </div>
    </div>`;
  }).join("");
}

function radarSvg(levels){
  const n=levels.length, size=260, c=size/2, R=size/2-40;
  // 相對比例：全部同級時是正多邊形，差距極大時也不會超出畫布
  const max=Math.max(1,...levels.map(l=>l.lv));
  // Lv0 留一段最小半徑，不然那個頂點會塌到圓心，看不出核心存在
  const MIN=0.12;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;
  const pt=(i,r)=>[c+r*Math.cos(ang(i)), c+r*Math.sin(ang(i))];
  const poly=r=>levels.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ");
  const grid=[0.25,0.5,0.75,1].map(f=>
    `<polygon points="${poly(R*f)}" fill="none" stroke="#1e3a4a" stroke-width="1"/>`).join("");
  const spokes=levels.map((_,i)=>{
    const [x,y]=pt(i,R);
    return `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
      stroke="#1e3a4a" stroke-width="1"/>`;
  }).join("");
  const shape=levels.map((l,i)=>
    pt(i,R*(MIN+(1-MIN)*(l.lv/max))).map(v=>v.toFixed(1)).join(",")).join(" ");
  const dots=levels.map((l,i)=>{
    const [x,y]=pt(i,R*(MIN+(1-MIN)*(l.lv/max)));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"
      fill="${cssColor(l.core.color)}"/>`;
  }).join("");
  const labels=levels.map((l,i)=>{
    const [x,y]=pt(i,R+22);
    const col=cssColor(l.core.color);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle"
      dominant-baseline="middle" font-size="13">${esc(l.core.icon)}</text>
      <text x="${x.toFixed(1)}" y="${(y+12).toFixed(1)}" text-anchor="middle"
      dominant-baseline="middle" font-size="8" fill="${col}"
      font-family="'Share Tech Mono',monospace">${l.lv}</text>`;
  }).join("");
  return `<div style="display:flex;justify-content:center">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="max-width:100%">
      ${grid}${spokes}
      <polygon points="${shape}" fill="#4a9eff33" stroke="#4a9eff" stroke-width="2"/>
      ${dots}${labels}
    </svg>
  </div>`;
}

async function toggleReminders(){
  if(!window.Reminders)return;
  const before=window.Reminders.status();
  const after=before.enabled?window.Reminders.disable():await window.Reminders.enable();
  if(!before.enabled&&!after.enabled&&after.permission==="denied"){
    alert("通知權限已被瀏覽器封鎖，需要到瀏覽器設定中解除才能開啟。");
  }
  render();
  showToast(after.enabled?"✓ 已開啟到期通知":"已關閉到期通知");
}

function exportData(){
  if(!window.Goals){
    // 寧可不給備份，也不要給一份看起來成功、實際缺資料的檔案
    alert("資料模組尚未載入，無法匯出。\n（以 file:// 直接開啟時模組無法載入，請改用網址開啟）");
    return;
  }
  flushState();
  // 所有資料現在都在同一份 schema v2 裡，匯出就是它本身
  const payload=window.Goals.exportPayload();
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="skill-tree-backup.json";a.click();
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d||typeof d!=="object")throw new Error("非物件格式");
      if(!window.Goals){
        throw new Error("資料模組尚未載入，已中止以免只還原一部分");
      }
      const isV2=Array.isArray(d.cores)&&Array.isArray(d.skills);
      const isV1=typeof d.charName==="string"&&Array.isArray(d.subSkills);
      if(!isV2&&!isV1)throw new Error("認不得的備份格式");
      // 匯入會覆蓋目前的資料且無法復原，所以先試算一次。等蓋掉之後才說
      // 「有 N 項沒進來」已經來不及了。
      const preview=window.Goals.inspectPayload(d);
      if(preview.total>0&&!confirm(
        `這份備份有 ${preview.total} 項資料無法完整轉入，匯入後不會出現。\n`+
        "目前的資料會被覆蓋，且無法復原。\n\n仍要匯入嗎？")){
        return;
      }
      // store 認得 v1 與 v2，兩者走同一條轉換路徑
      window.Goals.importPayload(d);
      loadState();
      if(state.cores)syncCores();
      render();
      // 唯讀模式下匯入只會停在畫面上，重開就沒了。說成匯入成功是騙人的。
      if(window.Goals.migrationReport().readOnly){
        alert("匯入的資料只顯示在畫面上，並沒有存進瀏覽器：這次開啟處於唯讀"+
              "狀態（讀不到儲存空間，或原始資料的備份留不成）。\n\n"+
              "請先排除儲存問題再重新匯入。");
        return;
      }
      showToast(preview.total>0
        ?`✓ 匯入完成（${preview.total} 項資料無法完整轉入）`
        :"✓ 匯入成功",preview.total>0?4000:1800);
    }catch(err){
      alert(`匯入失敗：${err.message||"檔案格式不正確"}`);
    }
  };
  reader.readAsText(file);
  // Reset input so same file can be re-imported
  e.target.value="";
}

function updateMergePreview(){
  const checked=[...document.querySelectorAll('#merge-sub-list input:checked')];
  const preview=document.getElementById("merge-preview");
  if(!preview)return;
  if(checked.length<2){preview.style.display="none";return;}
  const total=checked.reduce((sum,cb)=>{
    const s=state.subSkills.find(x=>x.id==cb.value);
    return sum+(s?s.xp||0:0);
  },0);
  const names=checked.map(cb=>{
    const s=state.subSkills.find(x=>x.id==cb.value);
    return s?`${s.icon||"⭐"}${s.name}`:"";
  }).filter(Boolean).join(" + ");
  preview.style.display="block";
  preview.textContent=`${names} → 合併後 EXP：${total}`;
}

function confirmMerge(fromCoreId){
  const checked=[...document.querySelectorAll('#merge-sub-list input:checked')];
  if(checked.length<2){showToast("請至少選擇 2 個技能");return;}
  const name=document.getElementById("merge-name")?.value?.trim();
  if(!name){showToast("請輸入新技能名稱");return;}
  const icon=document.getElementById("merge-icon")?.value||"🔀";
  const desc=document.getElementById("merge-desc")?.value||"";
  const targetCoreId=window._mergeCoreId||fromCoreId;
  const type=window._mergeType||"active";

  // Gather source skills
  const sources=checked.map(cb=>state.subSkills.find(x=>x.id==cb.value)).filter(Boolean);
  const totalXP=sources.reduce((sum,s)=>sum+(s.xp||0),0);
  const today=new Date().toLocaleDateString("zh-TW");

  // Build detailed merge record listing each skill's name, XP, source book, and description
  const sourceLines=sources.map(s=>{
    const bookPart=s.source?` 📚${s.source}`:"";
    const descPart=s.desc?`\n　　↳ ${s.desc}`:"";
    return `・${s.icon||"⭐"}${s.name}（EXP ${s.xp||0}${bookPart}）${descPart}`;
  }).join("\n");
  const mergeRecord={
    id:"n_"+(Date.now()-1),
    text:`⚗ 合併自：\n${sourceLines}\n　合計 EXP ${totalXP}`,
    date:today
  };

  // Collect all notes from source skills (preserve original skill attribution via date prefix)
  const mergedNotes=[mergeRecord,...sources.flatMap(s=>s.notes||[])];

  // Merge all unique source books (limit display to avoid unbounded growth)
  const allSources=sources.flatMap(s=>(s.source||"").split(/\s*\+\s*/)).map(x=>x.trim()).filter(Boolean);
  const uniqueArr=[...new Set(allSources)];
  const uniqueSources=uniqueArr.length<=4
    ? uniqueArr.join(" + ")
    : uniqueArr.slice(0,4).join(" + ")+` …等 ${uniqueArr.length} 項`;

  // Build a combined description preserving each source skill's original ability
  const descParts=sources.filter(s=>s.desc).map(s=>`${s.name}：${s.desc}`);
  const combinedDesc=desc||descParts.join("　|　");

  // 合併交給 store：XP 相加轉入新技能、來源關係寫進 mergedFrom、留下一筆金額為
  // 0 的 merge 紀錄（§4.5）。總 XP 不變，也不會讓當天的成果數字膨脹。
  flushState();
  try{
    window.Goals.mergeSkills({
      sourceIds:sources.map(s=>s.id),
      coreId:targetCoreId,
      name,icon,type,
      desc:combinedDesc,
      source:uniqueSources,
      notes:mergedNotes,
    });
  }catch{
    showToast("合併失敗，請重新整理再試");return;
  }
  loadState();
  closeMergeModal();
  // Navigate to the target core's detail page
  detailCore=targetCoreId;
  render();
  showToast(`⚗ 合併完成！${name} EXP ${totalXP}`,2500);
}

function saveSub(){
  if(!modalData)return;
  flushState();
  const d=modalData.data;
  d.name=document.getElementById("m-name")?.value?.trim()||"";
  if(!d.name)return;
  d.desc=document.getElementById("m-desc")?.value||"";
  d.icon=document.getElementById("m-icon")?.value||"⭐";
  d.source=document.getElementById("m-source")?.value||"";
  const prevLv=d.id?calcLv(getCoreXP(d.coreId)):0;
  // XP 一律走 store 的發放路徑：這裡先保留原值，存完再以差額寫入一筆 manual
  // 紀錄，xpLog 的加總才會永遠等於目前 XP（§4.4）。
  const targetXp=Math.max(0,parseInt(document.getElementById("m-xp")?.value)||0);
  d.coreId=document.getElementById("m-core")?.value||d.coreId;
  let id=d.id;
  if(id){
    d.xp=state.subSkills.find(s=>s.id===id)?.xp||0;
    state.subSkills=state.subSkills.map(s=>s.id===id?{...d}:s);
  }else{
    id="sk_"+Date.now();
    d.xp=0;
    state.subSkills.push({...d,id});
  }
  writeState();
  try{
    window.Goals.setSkillXp(id,targetXp);
  }catch{
    showToast("XP 沒有存進去，請重新整理再試",2500);
  }
  loadState();
  const newLv=calcLv(getCoreXP(d.coreId));
  closeModal();render();showToast("✓ 已儲存");
  if(newLv>prevLv){
    const c=CORE_MAP[d.coreId];
    setTimeout(()=>showToast(`🎊 升級！${c.icon}${c.title} → Lv${newLv}！`,3000),400);
  }
}
function deleteCore(coreId){
  const c=state.cores?state.cores.find(x=>x.id===coreId):CORES.find(x=>x.id===coreId);
  const subCount=state.subSkills.filter(s=>s.coreId===coreId).length;
  const msg=subCount>0
    ?`確定刪除「${c?c.title:coreId}」？
此核心技能下有 ${subCount} 個子技能也會一併刪除。`
    :`確定刪除「${c?c.title:coreId}」？`;
  if(!confirm(msg))return;
  // Remove from state.cores
  if(!state.cores)state.cores=[...CORES];
  state.cores=state.cores.filter(x=>x.id!==coreId);
  // Remove sub skills
  state.subSkills=state.subSkills.filter(s=>s.coreId!==coreId);
  // Rebuild CORES array from state
  syncCores();
  saveState();detailCore=null;render();
  showToast("已刪除核心技能");
}

function saveNewCore(){
  const title=document.getElementById("nc-title")?.value?.trim();
  if(!title){alert("請輸入名稱");return;}
  const name=document.getElementById("nc-name")?.value?.trim()||"";
  const icon=document.getElementById("nc-icon")?.value?.trim()||"⭐";

  const id="core_"+Date.now();
  const newCore={id,title,name,icon,color};
  if(!state.cores)state.cores=[...CORES];
  state.cores.push(newCore);
  syncCores();
  saveState();closeModal();render();
  showToast("✦ 新增核心技能："+title);
}

function syncCores(){
  // Sync the runtime CORES array from state.cores (snapshot first for safety)
  if(state.cores&&state.cores.length>0){
    const snapshot=[...state.cores];
    CORES.length=0;
    snapshot.forEach(c=>CORES.push(c));
    // Rebuild CORE_MAP atomically
    Object.keys(CORE_MAP).forEach(k=>delete CORE_MAP[k]);
    CORES.forEach(c=>CORE_MAP[c.id]=c);
  }
}

  }
}

// 所以這不只是顯示問題（src/views.js 用的是同一個函式）。
function esc(v){return window.Goals.esc(v);}

// 顏色進的是 inline style，HTML 跳脫擋不住 CSS 的分隔字元（`;` `:` `(`）：
// `esc()` 之後仍然可以塞進整串宣告。收斂成十六進位色碼，與 model 同一個判定。
function cssColor(v){return window.Goals.color(v);}

function stepMeta(s){return KIND_META[s.kind]||KIND_META.side;}
function isActionableStep(s){return !s.archived&&ACTIONABLE_STATES.has(s.state);}
function isDailyDoneToday(s){
  return s.kind==="daily"&&s.lastCompletedDate===todayStr();
}
function stepStreak(s){return window.Goals.calcStreak(s.streakHistory,todayStr());}
function skillById(id){return window.Goals.listSkills().find(x=>x.id===id)||null;}
function goalTitle(id){
  if(!id)return "";
  const g=window.Goals.listGoals().find(x=>x.id===id);
  return g?g.title:"";
}
function stepById(id){return window.Goals.listSteps().find(s=>s.id===id)||null;}

function renderQuests(){
  // 到期標籤同樣以邏輯日為準（§5.0），否則凌晨 0-4 點卡片會說「逾期 1 天」，
  // 提醒面板與 checkOverdue() 卻說今天到期。
  const today=todayStr();
  const steps=window.Goals.listSteps();

  // 帶目標的主線只露出該目標當下的「下一步」（§3.5）。把整條主線攤開的話，
  // 使用者可以跳過順序先完成後面的步驟並拿到 XP，目標頁維持的「一次一步」
  // 就形同虛設。沒有目標的主線（遷移進來的舊任務）不受這條限制。
  const nextIds=new Set(window.Goals.nextStepIds());
  const inSequence=s=>s.kind!=="main"||!s.goalId||nextIds.has(s.id);
  // 目標封存或完成之後，它底下的步驟就不該再出現在待辦裡——今日、回顧與到期
  // 提醒都已經只看進行中的目標，任務頁不跟上就會變成繼續替一個收掉的目標賺 XP
  // 的側門。完成與封存分頁不套這條，紀錄要留得住。
  const activeGoals=new Set(window.Goals.listGoals()
    .filter(g=>g.status==="active").map(g=>g.id));
  const inScope=s=>!s.goalId||activeGoals.has(s.goalId);
  // 每日任務不進 DONE（§5.1），所以「進行中」對它來說永遠成立（除非封存）。
  const isOpen=s=>(s.kind==="daily"?!s.archived:isActionableStep(s))
    &&inSequence(s)&&inScope(s);
  const filtered=steps.filter(s=>{
    if(questFilter==="done")    return s.state===DONE_STATE&&s.kind!=="daily"&&!s.archived;
    if(questFilter==="archive") return s.archived===true;
    if(questFilter==="all")     return isOpen(s);
    // 每日分頁沒有自己的規則：走同一個 isOpen，才不會漏掉封存目標的範圍檢查
    return isOpen(s)&&s.kind===questFilter;
  });

  const counts={
    all:     steps.filter(isOpen).length,
    main:    steps.filter(s=>isOpen(s)&&s.kind==="main").length,
    side:    steps.filter(s=>isOpen(s)&&s.kind==="side").length,
    daily:   steps.filter(s=>isOpen(s)&&s.kind==="daily").length,
    inbox:   steps.filter(s=>isOpen(s)&&s.kind==="inbox").length,
    done:    steps.filter(s=>s.state===DONE_STATE&&s.kind!=="daily"&&!s.archived).length,
    archive: steps.filter(s=>s.archived===true).length,
  };

  const tabs=[
    {k:"all",     label:`全部 (${counts.all})`},
    {k:"main",    label:`⚔️ 主線 (${counts.main})`},
    {k:"side",    label:`🗺️ 支線 (${counts.side})`},
    {k:"daily",   label:`🌟 每日 (${counts.daily})`},
    {k:"inbox",   label:`📥 收件匣 (${counts.inbox})`},
    {k:"done",    label:`✓ 完成 (${counts.done})`},
    {k:"archive", label:`📦 封存 (${counts.archive})`},
  ].map(t=>`<button class="qtab ${questFilter===t.k?"active":""}"
    style="${questFilter===t.k?`background:${t.k==="archive"?"#f59e0b":t.k==="done"?"#22d3ee":"#4a9eff"}22;border-color:${t.k==="archive"?"#f59e0b":t.k==="done"?"#22d3ee":"#4a9eff"};color:${t.k==="archive"?"#f59e0b":t.k==="done"?"#22d3ee":"#4a9eff"}`:""}"
    onclick="questFilter='${t.k}';render()">${t.label}</button>`).join("");

  let cards="";
  if(filtered.length===0){
    cards=`<div class="empty-state" style="margin-top:20px">
      ${questFilter==="done"?"尚無完成的任務":questFilter==="archive"?"尚無封存的任務":"沒有進行中的任務<br><small>點右下角 + 新增任務</small>"}
    </div>`;
  } else if(questFilter==="archive"){
    // 依完成時間新到舊排，並依年月分組
    const sorted=[...filtered].sort((a,b)=>
      new Date(b.completedAt||b.createdAt||0)-new Date(a.completedAt||a.createdAt||0));
    let lastMonthKey="";
    cards=sorted.map(s=>{
      const dateStr=s.completedAt||s.createdAt||"";
      const d=dateStr?new Date(dateStr):null;
      const monthKey=d?`${d.getFullYear()}-${d.getMonth()}`:"";
      const monthLabel=d?`${d.getFullYear()} 年 ${d.getMonth()+1} 月`:"";
      let divider="";
      if(monthKey!==lastMonthKey){
        lastMonthKey=monthKey;
        divider=`<div style="display:flex;align-items:center;gap:8px;margin:16px 0 10px">
          <div style="flex:1;height:1px;background:linear-gradient(90deg,#f59e0b44,transparent)"></div>
          <span style="font-size:10px;color:#f59e0b;letter-spacing:2px;white-space:nowrap">📦 ${monthLabel}</span>
          <div style="flex:1;height:1px;background:linear-gradient(90deg,transparent,#f59e0b44)"></div>
        </div>`;
      }
      return divider+renderQuestCard(s,today);
    }).join("");
  } else if(questFilter==="daily"||questFilter==="all"){
    // 每日任務分成今天還沒做 / 今天做完了
    const dailyUndone=filtered.filter(s=>s.kind==="daily"&&!isDailyDoneToday(s));
    const dailyDone=filtered.filter(s=>s.kind==="daily"&&isDailyDoneToday(s));
    const others=filtered.filter(s=>s.kind!=="daily");
    const otherCards=others.map(s=>renderQuestCard(s,today)).join("");
    const undoneCards=dailyUndone.map(s=>renderQuestCard(s,today)).join("");
    const doneCards=dailyDone.length>0
      ?`<div style="color:var(--muted);font-size:9px;letter-spacing:2px;margin:14px 0 8px;padding-left:2px">
          ✓ 今日已完成 (${dailyDone.length})
        </div>${dailyDone.map(s=>renderQuestCard(s,today)).join("")}`
      :"";
    cards=otherCards+undoneCards+doneCards;
  } else {
    cards=filtered.map(s=>renderQuestCard(s,today)).join("");
  }

  const clearBtn=questFilter==="done"&&counts.done>0
    ?`<div style="display:flex;gap:6px;margin-bottom:10px">
        <button onclick="archiveAllDone()"
          style="flex:1;background:#1a1000;border:1px solid #f59e0b55;color:#f59e0b;
          border-radius:8px;padding:9px;cursor:pointer;font-size:11px;font-family:'Share Tech Mono',monospace">
          📦 全部封存 (${counts.done})
        </button>
        <button onclick="clearDoneQuests()"
          style="flex:1;background:#1a0808;border:1px solid #ef444455;color:#ef4444;
          border-radius:8px;padding:9px;cursor:pointer;font-size:11px;font-family:'Share Tech Mono',monospace">
          🗑 全部清除 (${counts.done})
        </button>
      </div>`
    :questFilter==="archive"&&counts.archive>0
    ?`<button onclick="clearArchived()"
        style="width:100%;background:#1a0808;border:1px solid #ef444455;color:#ef4444;
        border-radius:8px;padding:9px;cursor:pointer;font-size:11px;margin-bottom:10px;font-family:'Share Tech Mono',monospace">
        🗑 清除所有封存 (${counts.archive})
      </button>`
    :"";

  return `
    <div style="padding-bottom:70px">
      <div class="quest-tabs">${tabs}</div>
      ${clearBtn}
      ${cards}
    </div>
    <button class="quest-add-fab" onclick="openAddQuest()">＋</button>`;
}

function renderQuestCard(s, today){
  const qt=stepMeta(s);
  // 每日任務不進 DONE（§5.1）。遷移進來的舊 daily 或改過 kind 的任務可能還停在
  // DONE，把它當成完成就會少掉打卡按鈕，這條 streak 再也起不來——完成一次
  // markDaily() 就會把它拉回待辦。
  const isDone=s.kind!=="daily"&&s.state===DONE_STATE;
  let dueHtml="", isOverdue=false, isSoon=false;
  if(s.due&&!isDone){
    const diff=daysUntil(today,s.due);
    isOverdue=diff<0;
    isSoon=diff>=0&&diff<=3;
    const dueLabel=isOverdue?`逾期 ${Math.abs(diff)} 天`
      :diff===0?"今天截止"
      :diff===1?"明天截止"
      :`${diff} 天後截止`;
    dueHtml=`<span class="quest-due ${isOverdue?"overdue":isSoon?"soon":"ok"}">📅 ${dueLabel}</span>`;
  }

  // 歸屬：rewards 逐筆列出；沒有 rewards 就靠所屬目標的核心（§4.3）
  const rewardHtml=s.rewards.length>0
    ?s.rewards.map(r=>{
        const sk=skillById(r.skillId);
        return sk?`<span class="quest-reward">🎯 ${esc(sk.icon)} ${esc(sk.name)} +${r.xp} EXP</span>`:"";
      }).join("")
    :s.goalId
    ?`<span class="quest-reward" style="color:var(--muted2)">🎯 依目標歸屬</span>`
    :`<span class="quest-reward" style="color:var(--muted2)">尚未指定歸屬</span>`;

  const goalLabel=s.goalId
    ?`<span style="font-size:9px;color:var(--muted2)">🎯 ${esc(goalTitle(s.goalId))}</span>`:"";

  const isDailyDone=isDailyDoneToday(s);
  const cardDone=isDone||isDailyDone;
  let dailyMeta="";
  if(s.kind==="daily"){
    const streak=stepStreak(s);
    const streakStr=streak>=2?`🔥 ${streak} 天連續`:streak===1?"🔥 連續 1 天":"";
    const countStr=s.completedCount?`累計 ${s.completedCount} 次`:"";
    dailyMeta=`<span style="font-size:9px;color:var(--muted2);margin-left:6px">${[streakStr,countStr].filter(Boolean).join(" · ")}</span>`;
  }

  const createdLabel=s.createdAt
    ?`<span style="font-size:9px;color:var(--muted2)">📌 ${new Date(s.createdAt).toLocaleDateString("zh-TW",{year:"numeric",month:"numeric",day:"numeric"})}</span>`
    :"";

  return `<div class="quest-card ${cardDone?"done":""} ${isOverdue?"overdue":""}" onclick="openEditQuest('${s.id}')">
    <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${qt.color};border-radius:12px 0 0 12px"></div>
    <div style="padding-left:6px">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
        <span class="quest-badge" style="color:${qt.color};background:${qt.color}18;border:1px solid ${qt.color}44">
          ${qt.icon} ${qt.label}
        </span>
        ${isDailyDone?'<span class="daily-done-badge">✓ 今日已完成</span>':""}
        ${isDone?'<span style="font-size:9px;color:#10b981;margin-left:2px">✓ 已完成</span>':""}
        ${dailyMeta}
        ${goalLabel}
        ${createdLabel}
      </div>
      <div class="quest-title ${cardDone?"done-strike":""}">${esc(s.title)}</div>
      ${s.desc?`<div class="quest-desc">${esc(s.desc)}</div>`:""}
      <div class="quest-meta">
        <div style="display:flex;flex-direction:column;gap:3px">
          ${rewardHtml}
          ${dueHtml}
          ${s.due&&!isDone&&!s.archived?`<button
            onclick="event.stopPropagation();downloadICS('${s.id}')"
            style="align-self:flex-start;margin-top:3px;background:#a855f718;border:1px solid #a855f755;
            color:#a855f7;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:9px;
            font-family:'Share Tech Mono',monospace">📅 加入日曆</button>`:""}
          ${s.kind==="daily"&&!s.archived?`<button
            onclick="event.stopPropagation();backfillDaily('${s.id}')"
            style="align-self:flex-start;margin-top:3px;background:#10b98118;border:1px solid #10b98155;
            color:#10b981;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:9px;
            font-family:'Share Tech Mono',monospace">⏪ 補登</button>`:""}
        </div>
        ${isDone&&!s.archived?`<button class="quest-complete-btn"
          style="background:#f59e0b18;border:1px solid #f59e0b55;color:#f59e0b"
          onclick="event.stopPropagation();archiveQuest('${s.id}')">📦 封存</button>`:""}
        ${s.archived?`<button class="quest-complete-btn"
          style="background:#22d3ee18;border:1px solid #22d3ee55;color:#22d3ee"
          onclick="event.stopPropagation();unarchiveQuest('${s.id}')">↩ 取消封存</button>`:""}
        ${!isDone&&!s.archived?`<button class="quest-complete-btn"
          style="background:${isDailyDone?"#1e3a4a":qt.color+"22"};
          border:1px solid ${isDailyDone?"#2a4a6a":qt.color+"66"};
          color:${isDailyDone?"var(--muted)":qt.color};
          opacity:${isDailyDone?0.5:1}"
          onclick="event.stopPropagation();completeQuest('${s.id}')">
          ${isDailyDone?"明日再來":"✓ 完成"}</button>`:""}
      </div>
    </div>
  </div>`;
}

// 日界凌晨 4:00（§5.0）。整個 app 只有這一個「今天」，由 src/rpg.js 提供。
function todayStr(){return window.Goals.todayISO();}
// 兩個 YYYY-MM-DD 相差幾天。用 UTC 做算術，避免日光節約時間讓某些日子變成
// 23 或 25 小時；直接 new Date("YYYY-MM-DD") 則是 UTC 午夜，在負偏移的時區
// 會整個早一天。
function daysUntil(fromISO,toISO){
  const at=iso=>{const[y,m,d]=String(iso).split("-").map(Number);return Date.UTC(y,m-1,d);};
  return Math.round((at(toISO)-at(fromISO))/86400000);
}

function completeQuest(id){
  const s=stepById(id);
  if(!s)return;
  if(s.kind==="daily"&&isDailyDoneToday(s)){
    showToast("今日已完成，明天再來！");return;
  }
  // 完成與 XP 發放都交給 store：狀態、streak、xpLog 與未歸屬 XP 在那裡一次處理
  // （§4.2、§5.1），這裡只負責把結果講給使用者聽。
  flushState();
  const prevLevels={};
  CORES.forEach(c=>{prevLevels[c.id]=calcLv(getCoreXP(c.id));});
  // 用 store 的完整技能清單比對：歸到「歷練」的 XP 也要講出來
  const before=new Map(window.Goals.listSkills().map(x=>[x.id,x.xp||0]));
  try{
    window.Goals.completeStep(id);
  }catch{
    // 收件匣是唯一沒有事先歸屬的 kind，完成時才問（§4.3）。沒選就不完成。
    if(s.kind!=="inbox"){showToast("完成失敗，請重新整理再試");return;}
    const coreId=window.Goals.pickCore("這次完成的 XP 要算到哪個核心？");
    if(!coreId)return;
    try{
      window.Goals.completeStep(id,{coreId});
    }catch{
      showToast("完成失敗，請重新整理再試");return;
    }
  }
  loadState();

  const msgs=[];
  window.Goals.listSkills().forEach(x=>{
    const gained=(x.xp||0)-(before.get(x.id)||0);
    if(gained>0)msgs.push(`${x.name}+${gained}`);
  });
  const levelUps=[];
  CORES.forEach(c=>{
    const newLv=calcLv(getCoreXP(c.id));
    if(newLv>prevLevels[c.id])levelUps.push(`${c.icon}${c.title} → Lv${newLv}！`);
  });
  if(levelUps.length>0){
    setTimeout(()=>showToast(`🎊 升級！${levelUps.join(" ")}`,3500),800);
  }
  if(msgs.length>0)showToast(`🎉 ${s.title} 完成！${msgs.join(" · ")}`);
  else showToast(`🎉 任務完成：${s.title}`);
  render();
}

// 補登（§5.1）：只能補過去 3 天，XP 記在被補登的那一天。
function backfillDaily(id){
  const s=stepById(id);
  if(!s)return;
  const yesterday=window.Goals.shiftDate(todayStr(),-1);
  const date=prompt(`補登哪一天？（YYYY-MM-DD，只能補過去 ${window.Goals.BACKFILL_DAYS} 天內）`,yesterday);
  if(!date||!date.trim())return;
  flushState();
  try{
    window.Goals.backfillDaily(id,date.trim());
  }catch(err){
    alert(err.message);return;
  }
  loadState();render();
  showToast(`⏪ 已補登 ${date.trim()}`);
}

function openAddQuest(){
  _editingQuest=null;
  showQuestModal(null);
}
function openEditQuest(id){
  _editingQuest=stepById(id);
  showQuestModal(_editingQuest);
}

let _editingQuest=null;
let _modalRewards=[];

  const kind=s?.kind||"main";

  const overlay=document.createElement("div");
  overlay.id="modal";overlay.className="modal-overlay";
  overlay.onclick=e=>{if(e.target===overlay)closeModal();};
  overlay.innerHTML=`
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" style="color:#f59e0b">◆ ${isNew?"新增任務":"編輯任務"} ◆</div>

      <label class="form-label">任務類型</label>
      <div class="type-toggle" style="margin-bottom:14px">
        ${Object.entries(KIND_META).map(([k,t])=>`
          <button id="qtype-${k}" class="type-btn"
            style="${kind===k?`background:${t.color}22;border-color:${t.color};color:${t.color}`:""}"
            onclick="selectQType('${k}')">${t.icon} ${t.label.replace("任務","")}</button>`).join("")}

      <label class="form-label">描述</label>
      <textarea class="form-input" id="q-desc" rows="2"
        style="resize:none;height:60px;line-height:1.5"
        placeholder="任務目標或備注...">${esc(s?.desc)}</textarea>

      <label class="form-label">截止日期與時間</label>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input class="form-input" type="date" id="q-due" value="${esc(s?.due)}"

          style="background:#f59e0b22;border:1px solid #f59e0b66;color:#f59e0b;
          border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;flex-shrink:0">+</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <select class="form-select" id="core-pick-select" style="margin-bottom:0;flex:1">
          <option value="">或直接記到某個核心的「歷練」…</option>
          ${window.Goals.listCores().map(c=>`<option value="${esc(c.id)}">${esc(c.icon)} ${esc(c.title||c.name)}</option>`).join("")}
        </select>
        <button onclick="addRewardCoreFromSelect()"
          style="background:#22d3ee22;border:1px solid #22d3ee66;color:#22d3ee;
          border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;flex-shrink:0">+</button>
      </div>
      <div style="font-size:9px;color:var(--muted2);margin-bottom:14px">
        主線 / 支線 / 每日必須指定歸屬；收件匣可以先空著，完成或指派時再指定。
      </div>

      <div class="modal-actions">
        <button class="btn-save" style="background:#f59e0b22;border:1px solid #f59e0b77;color:#f59e0b"
          onclick="saveQuest()">
          ${isNew?"✦ 新增任務":"儲存"}
        </button>
        ${!isNew?`<button class="btn-del" onclick="deleteQuest('${s.id}')">刪除</button>`:""}
      </div>
    </div>`;
  document.body.appendChild(overlay);

}

function renderRewardList(){
  const el=document.getElementById("reward-list");
  if(!el)return;
  if(_modalRewards.length===0){
    el.innerHTML='<div style="font-size:10px;color:var(--muted2);padding:4px 0 8px">尚未指定歸屬</div>';
  } else {
    let rows="";
    _modalRewards.forEach((r,i)=>{
      const sk=skillById(r.skillId);
      if(!sk)return;
      const c=CORE_MAP[sk.coreId];
      const xpBtns=[10,25,50,100].map(v=>{
        const active=(r.xp||50)===v;
        return '<button onclick="event.stopPropagation();_modalRewards['+i+'].xp='+v+';renderRewardList()" '
          +'style="background:'+(active?"#f59e0b33":"var(--bg2)")
          +';border:1px solid '+(active?"#f59e0b":"var(--border)")
          +';color:'+(active?"#f59e0b":"var(--muted)")
          +';border-radius:5px;padding:3px 8px;cursor:pointer;font-size:10px">'+v+'</button>';
      }).join("");
      rows+='<div class="reward-skill-row">'
        +'<span class="reward-skill-name">'+esc(sk.icon)+" "+esc(sk.name)
        +'<span style="color:var(--muted2);font-size:9px"> ('+esc(c?c.title||c.name:"")+")</span></span>"
        +'<div style="display:flex;gap:3px;flex-shrink:0">'+xpBtns+'</div>'
        +'<button class="reward-del" onclick="_modalRewards.splice('+i+',1);renderRewardList();refreshSkillSelect()">✕</button>'
        +'</div>';
    });
    el.innerHTML=rows;
  }
  refreshSkillSelect();
}
function refreshSkillSelect(){
  const sel=document.getElementById("skill-pick-select");
  if(!sel)return;
  const existing=new Set(_modalRewards.map(r=>r.skillId));
  const available=state.subSkills.filter(s=>!existing.has(s.id));
  sel.innerHTML=`<option value="">選擇需要的子技能…</option>`
    +available.map(s=>{
      const c=CORE_MAP[s.coreId];
      return `<option value="${esc(s.id)}">${esc(s.icon)} ${esc(s.name)} (${esc(c?c.title||c.name:"")})</option>`;
    }).join("");
}

function addRewardSkillFromSelect(){
  const sel=document.getElementById("skill-pick-select");
  if(!sel||!sel.value)return;
  addModalReward(sel.value);
}

// 沒有合適的子技能時，直接記到核心的承接技能「歷練」（§4.3）。
function addRewardCoreFromSelect(){
  const sel=document.getElementById("core-pick-select");
  if(!sel||!sel.value)return;
  addModalReward(`sk_${sel.value}_general`);
  sel.value="";
}

function addModalReward(skillId){
  if(!skillId||_modalRewards.find(r=>r.skillId===skillId))return;
  const kind=document.getElementById("q-type")?.value||"main";
  _modalRewards.push({skillId,xp:window.Goals.KIND_DEFAULT_XP[kind]||50});
  renderRewardList();
}

function selectQType(k){
  document.getElementById("q-type").value=k;
  Object.entries(KIND_META).forEach(([key,t])=>{
    const btn=document.getElementById("qtype-"+key);
    if(!btn)return;
    if(key===k){
      btn.style.background=t.color+"22";
      btn.style.borderColor=t.color;
      btn.style.color=t.color;
    } else {
      btn.style.background="";btn.style.borderColor="";btn.style.color="";
    }
  });
}

function saveQuest(){
  const title=document.getElementById("q-title")?.value?.trim();
  if(!title){alert("請輸入任務名稱");return;}
  const spec={
    kind: document.getElementById("q-type")?.value||"main",
    title,
    desc: document.getElementById("q-desc")?.value?.trim()||"",
    due: document.getElementById("q-due")?.value||null,
    dueTime: document.getElementById("q-due-time")?.value||null,
    rewards: [..._modalRewards],
  };
  flushState();
  try{
    if(_editingQuest)window.Goals.updateStep(_editingQuest.id,spec);
    else window.Goals.createStep(spec);
  }catch(err){
    // 歸屬沒指定就擋在這裡，不寫下一筆之後才要補救的資料（§4.3）
    alert(err.message);return;
  }
  loadState();closeModal();render();showToast("✓ 已儲存");
}

function downloadICS(id){
  const s=stepById(id);
  if(!s||!s.due)return;

  // Build start datetime
  const dateStr=s.due; // YYYY-MM-DD
  const timeStr=s.dueTime||"09:00"; // HH:MM, default 9am if no time set
  const [y,mo,d]=dateStr.split("-").map(Number);
  const [h,mi]=timeStr.split(":").map(Number);

  // Format to iCal datetime: YYYYMMDDTHHMMSS (local time with TZID approach)
  const pad=n=>String(n).padStart(2,"0");
  const dtStart=`${y}${pad(mo)}${pad(d)}T${pad(h)}${pad(mi)}00`;
  // End = start + 1 hour
  const endDate=new Date(y,mo-1,d,h+1,mi);
  const dtEnd=`${endDate.getFullYear()}${pad(endDate.getMonth()+1)}${pad(endDate.getDate())}T${pad(endDate.getHours())}${pad(endDate.getMinutes())}00`;

  const uid=`quest-${s.id}@skill-pwa`;
  const now=new Date();
  const dtStamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}Z`;
  const desc=s.desc?s.desc.replace(/\n/g,"\\n"):"";
  const alarm=s.dueTime
    ?`BEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:${s.title} 即將到期\r\nEND:VALARM\r\n`
    :"";

  const ics=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//人生技能樹//ZH",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${dtStamp}`,
    `DTSTART:${dtStart}`,
    `DTEND:${dtEnd}`,
    `SUMMARY:${s.title}`,
    `DESCRIPTION:${desc}`,
    alarm.replace(/\r\n$/, ""),
    "END:VEVENT",
    "END:VCALENDAR"
  ].filter(Boolean).join("\r\n");

  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  // iOS Safari doesn't support createObjectURL for file download reliably
  // Use data URI instead
  const reader=new FileReader();
  reader.onload=()=>{
    const a=document.createElement("a");
    a.href=reader.result;
    a.download=`${s.title.replace(/[^\w一-鿿]/g,"_")}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
  reader.readAsDataURL(blob);
  showToast("📅 .ics 已下載，點開即可加入日曆");
}

function archiveQuest(id){
  flushState();
  window.Goals.archiveStep(id,true);
  loadState();render();showToast("📦 已封存任務");
}
function unarchiveQuest(id){
  flushState();
  window.Goals.archiveStep(id,false);
  loadState();render();showToast("↩ 已取消封存");
}
function archiveAllDone(){
  const cnt=window.Goals.listSteps().filter(s=>
    s.state===DONE_STATE&&s.kind!=="daily"&&!s.archived).length;
  if(!confirm(`確定封存所有 ${cnt} 個已完成任務？`))return;
  flushState();
  const n=window.Goals.archiveDoneSteps();
  loadState();render();showToast(`📦 已封存 ${n} 個任務`);
}
function clearArchived(){
  const cnt=window.Goals.listSteps().filter(s=>s.archived).length;
  if(!confirm(`確定永久清除所有 ${cnt} 個封存任務？此操作無法復原。`))return;
  flushState();
  const n=window.Goals.deleteStepsWhere(s=>s.archived===true);
  loadState();render();showToast(`🗑 已清除 ${n} 個封存任務`);
}
function clearDoneQuests(){
  const cnt=window.Goals.listSteps().filter(s=>
    s.state===DONE_STATE&&s.kind!=="daily"&&!s.archived).length;
  if(!confirm(`確定清除所有 ${cnt} 個已完成任務？此操作無法復原。`))return;
  flushState();
  const n=window.Goals.deleteStepsWhere(s=>
    s.state===DONE_STATE&&s.kind!=="daily"&&!s.archived);
  loadState();render();showToast(`🗑 已清除 ${n} 個已完成任務`);
}

function deleteQuest(id){
  if(!confirm("確定刪除此任務？"))return;
  flushState();
  window.Goals.deleteStep(id);
  loadState();closeModal();render();
}

// ── Check overdue & daily reset on app open (iOS-safe: no background timer dependency) ──
function checkOverdue(){
  // 逾期同樣以邏輯日為準（§5.0）。用當下的午夜判斷的話，凌晨 0-4 點這個提示會
  // 說「已逾期」，提醒面板卻說「今日到期」，兩邊對不上。
  const today=todayStr();
  // 只算使用者還看得到的：進行中目標底下的，加上沒有目標的。封存或完成的目標
  // 底下的步驟不會出現在任何清單上，也就不該替它們發逾期提示。
  const activeGoals=new Set(window.Goals.listGoals()
    .filter(g=>g.status==="active").map(g=>g.id));
  const steps=window.Goals.listSteps().filter(s=>!s.goalId||activeGoals.has(s.goalId));
  const overdue=steps.filter(s=>
    s.kind!=="daily"&&s.due&&s.due<today&&isActionableStep(s));
  if(overdue.length>0)showToast(`⚠️ 有 ${overdue.length} 個任務已逾期`,2500);

  const pendingDaily=steps.filter(s=>
    s.kind==="daily"&&!s.archived&&!isDailyDoneToday(s)).length;
  if(pendingDaily>0){
    setTimeout(()=>showToast(`🌟 今日還有 ${pendingDaily} 個每日習慣待完成`,2500),overdue.length>0?3200:600);
  }

  // iOS-safe midnight re-render: only schedule if tab is visible, check again on visibilitychange
  document.removeEventListener("visibilitychange",_onVisible);
  document.addEventListener("visibilitychange",_onVisible);
}
function _onVisible(){
  if(!document.hidden){render();checkOverdue();}
}

// 資料層在 src/ 的 module 裡，module script 是 deferred，會在這段 inline script
// 跑完之後才執行。所以啟動要等它就位，由它回頭呼叫 boot()。
function boot(){
  loadState();
  if(state.cores)syncCores();
  const r=window.Goals.migrationReport();
  if(r.degraded){
    alert("讀不到瀏覽器儲存空間，這次開啟看到的是空白資料。\n"+
          "你原本的資料很可能還在，只是這次拿不到，因此這個工作階段不會寫入任何東西。\n\n"+
          "請關掉無痕／隱私模式或解除網站資料限制後再開一次。");
  }
  // 只有全新安裝才給預設技能，而且立刻落地。若改用「技能是空的就補預設」，
  // 使用者把技能全部刪光之後重開，這批預設會自己長回來。
  if(r.fresh&&!state.subSkills.length){
    state.subSkills=DEFAULT_SUBS.map(s=>({...s,id:"sk_"+s.id,notes:[]}));
    window.Goals.saveLegacyState(state);
  }
  if(r.migrated){
    showToast(r.total>0
      ?`✓ 資料已升級（${r.total} 項資料無法完整轉入）`
      :"✓ 資料已升級",r.total>0?4000:2000);
  }else if(r.total>0){
    // 一般開啟時讀到壞掉的紀錄同樣要講。不講的話，使用者只會看到東西少了，
    // 卻不知道發生過什麼、也不知道原始資料還留著一份副本。
    if(r.readOnly){
      alert(`有 ${r.total} 項資料讀不進來，而原始資料的備份這次留不成（可能是`+
            "儲存空間已滿）。\n"+
            "為了不覆蓋掉那些還可能救回來的紀錄，這次開啟不會寫入任何東西，"+
            "所有變更都不會保存。\n\n請先清出瀏覽器儲存空間，再重新開啟。");
    }else{
      showToast(`⚠ ${r.total} 項資料讀不進來，原始資料已另存一份備份`,4000);
    }
  }
  checkOverdue();
  render();
  showDailySummary();
}
window.boot=boot;

// 模組沒載入就沒有資料層。顯示一份空白的預設資料會讓人以為資料不見了，
// 不如直接說清楚原因。
document.getElementById("content").innerHTML=
  `<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:13px">
     資料模組載入中…<br><br>
     <span style="font-size:11px">若一直停在這裡，代表是以 file:// 直接開啟；
     請改用網址（http / https）開啟。</span>
   </div>`;
</script>
<script type="module">
// 資料模型與目標檢視。install() 會載入 store（必要時跑一次 v1 → v2 遷移），
// 之後才輪到上面的 inline script 啟動。
import {install} from "./src/views.js";
